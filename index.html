<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turf Operations — booking console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="shell">
  <!-- header is patched on its own each second so the clock ticks without
       redrawing the ~500 slot bubbles underneath it -->
  <header class="topbar" id="topbar"></header>

  <!-- the active view renders into here -->
  <div id="view"></div>

  <!-- modals live outside the view so their z-index is never trapped -->
  <div id="modals"></div>
</div>

<script src="app.js"></script>
</body>
</html>
