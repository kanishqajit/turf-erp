<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181C">
<title>Futly Console — on the ground</title>

<!-- Added to the home screen this launches as its own app rather than a tab.
     iOS reads the three apple- metas; everything else reads the manifest. The
     status bar is translucent so the ink header runs under it, which is why
     the header pads itself by env(safe-area-inset-top). -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Futly">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700&display=swap">
<link rel="stylesheet" href="mobile.css">
</head>
<body>

<!-- On a phone this fills the screen. On a desktop it centres as a phone-width
     column so the build can be reviewed without a device. -->
<div class="m-phone">
  <div class="m-app">
    <!-- header is per screen: dark shift bar on home, paper back-bar elsewhere -->
    <header id="mHeader"></header>

    <!-- the one scrolling pane; its offset is remembered per screen -->
    <div id="mBody"></div>

    <!-- fixed action dock, home only -->
    <div id="mDock"></div>
  </div>

  <!-- sheets sit outside .m-app so the dock can never overlap them -->
  <div id="mSheet"></div>
</div>

<script src="mobile.js"></script>
</body>
</html>
