<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1B1B">
<title>Futly Console — demonstration</title>

<!-- Its own manifest id, so Android installs this beside the real console
     rather than replacing it. Served from the site, it installs chrome-less;
     opened from a file it is still a working page, just not installable. -->
<link rel="manifest" href="/demo.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Futly Demo">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700&display=swap">

<style>
/* ═══════════════════════════════════════════════════════
   TURF OPERATIONS — mobile, built to the Claude Design
   handoff (Turf ERP Mobile.dc.html).

   Home is today's board with a live line running down it;
   rows near the line open and their bookings become cards.
   The other days, the custom-slot form and the reminder list
   push over it as their own screens.

   Every class here is `m-` prefixed and every state
   modifier is compound (`.m-cell.is-timer`). The console has
   twice been bitten by a bare one-word rule matching a
   modifier somewhere else — see CLAUDE.md.
   ═══════════════════════════════════════════════════════ */

/* Tokens are copied from styles.css rather than imported: this page must not
   pull in the console's stylesheet, whose layout rules assume a desk. If a
   token changes there, change it here too — styles.css is the source. */
:root{
  --ink:#16181C;
  --chrome:#282C31;        /* secondary buttons inside dark panels */
  --field:#22262B;         /* input wells inside dark panels */

  --lime:#D7F24B;
  --lime-deep:#BCD53C;
  --lime-tint:#EDF8C4;     /* held slots */
  --lime-tint2:#EFF8CE;    /* positive tags */
  --lime-pale:#F7FCE4;
  --lime-txt:#6E8A11;
  --lime-txt3:#6B7A2E;
  --lime-on-lime:#3E4A12;  /* type on a lime field */

  --paper:#fff;
  /* --page is the ground the app sits on; --soft is a quiet FILLED control
     sitting on it. On paper they are the same grey and nothing needed to tell
     them apart. Turn the page off and they are opposite jobs: the ground goes
     to the bottom of the stack and every quiet button has to rise off it, so a
     single token would have made the back arrow, the secondary buttons, the
     tags and the closed band heads invisible. */
  --page:#F4F5F0;
  --soft:#F4F5F0;
  --soft2:#F7F8F4;
  --edge:#EAECE4;
  --edge2:#E4E6DE;
  --edge3:#D5D9CE;
  --rule:#F0F1EC;

  /* Both were a shade too pale to read on paper — 3.06:1 and 2.41:1 at the
     sizes this app sets them. styles.css corrected them; these follow it. */
  --muted:#63696F;
  --muted2:#70767D;
  --body:#5E646B;

  --d-muted:#8B9199;
  --d-body:#A9AEB4;

  --red:#E4574B;
  --amber:#E0A21C;         /* the alarm line above a running clock */
  --owed:#BE3B2E;          /* a session that ended without paying */
  --owed-txt:#BE3B2E;      /* the same debt, set as type rather than a fill */
  --end-bg:#4A1A16;        /* the seat of the end-session button */
  --fill-deep:#16181C;     /* the deepest fill: the running clock, a counter sale */
  --raise:#16181C;         /* the ink surfaces that RISE: header, sheet, panel */
  --on-fill:#fff;          /* the label knocked out of one */
  --on-accent:#16181C;     /* type on lime — the same hex in both themes */
  --band:#ECEEE6;          /* the week grid's alternating rail */
  --frame:#C9CCC2;         /* the desktop review frame, not the phone */
  /* Past its end a match is still in play — same card, same two controls — but
     the count has turned from time left into time owed, so the ground turns
     with it. Deeper than the unpaid card's red, so the two stay apart. */
  --over-fill:#4E1A15;
  --head:var(--lime);      /* the pitch heads, and nothing else in the app */
  --amber-bg:#FFF3D6;
  --amber-line:#F1DFAE;
  --amber-on-dark:#F1DFAE;  /* amber type on a ground that is dark either way */
  --amber-txt:#8A5A00;
  --done:#B7C86B;

  --disp:'Barlow Condensed',system-ui,sans-serif;
  --sans:'Barlow',system-ui,sans-serif;

  /* The hour gutter. The sticky head, every row and the live line all measure
     from this one number — they will drift apart if any of them hard-codes it. */
  --gutter:52px;

  /* Launched from the home screen there is no browser chrome, so the status
     bar sits over the top of the page and the home indicator over the bottom.
     In a tab both insets are zero and nothing moves. */
  --safe-t:env(safe-area-inset-top, 0px);
  --safe-b:env(safe-area-inset-bottom, 0px);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
/* Without this, mobile font boosting inflates every block of type it decides is
   body copy — the shift header and the cards come out two sizes too big. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:var(--page);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
h1,h2,p{margin:0}
button{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.m-sheet button:focus-visible,.m-sheet input:focus-visible,
.m-shift button:focus-visible{outline-color:var(--lime)}

/* ─── shell ───────────────────────────────────────────── */
.m-phone{
  position:relative;width:100%;max-width:460px;margin:0 auto;
  height:100dvh;background:var(--page);overflow:hidden;
  display:flex;flex-direction:column;
}
.m-app{flex:1;display:flex;flex-direction:column;min-height:0}
#mHeader{flex:none}
#mBody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
/* A phone has no scrollbar gutter; the desktop review frame should not grow one
   that eats into the card column. */
#mBody{scrollbar-width:thin;scrollbar-color:var(--edge2) transparent}
#mBody::-webkit-scrollbar{width:0}
.m-sheet-card{scrollbar-width:none}
.m-sheet-card::-webkit-scrollbar{display:none}
#mDock{flex:none}

@media (max-width:519px){
  #mDock{position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:460px;margin:0 auto}
  /* --dock-h is measured after each paint; the bar's height changes with the
     collect strip appearing and going. */
  #mBody{padding-bottom:var(--dock-h,0px)}
}

/* Desktop review frame. Below this width the app simply fills the viewport. */
@media (min-width:520px){
  body{background:var(--frame);display:grid;place-items:center}
  .m-phone{
    height:min(880px,calc(100dvh - 48px));border-radius:34px;
    box-shadow:0 30px 70px rgba(0,0,0,.22),0 0 0 1px rgba(0,0,0,.1);
  }
}

/* ─── shift header (home) ─────────────────────────────── */
.m-shift{background:var(--raise);color:var(--on-fill);padding:calc(8px + var(--safe-t)) 15px 12px}

/* The line every app has: what this is, and who is signed in. It earns its
   height by being the only place to sign out from a phone. */
.m-brand{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.m-brand-mark{
  flex:none;width:23px;height:23px;border-radius:8px;background:var(--lime);color:var(--on-accent);
  display:grid;place-items:center;font:700 12px var(--disp);letter-spacing:.04em;
}
.m-brand b{
  flex:1;min-width:0;font:700 13.5px var(--sans);letter-spacing:-.1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.m-avatar{
  flex:none;width:29px;height:29px;border-radius:50%;border:1.5px solid var(--chrome);
  background:var(--field);color:#fff;cursor:pointer;
  font:700 11px var(--sans);letter-spacing:.04em;
}
.m-bar-avatar{
  flex:none;margin-left:auto;width:34px;height:34px;border-radius:50%;
  border:1.5px solid var(--edge2);background:var(--soft);color:var(--body);cursor:pointer;
  font:700 12px var(--sans);letter-spacing:.04em;
}
.m-shift-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.m-kicker{
  display:flex;align-items:center;gap:7px;
  font:700 10px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--d-muted);
}
.m-kicker i{width:7px;height:7px;border-radius:50%;background:var(--lime);display:block;flex:none}
.m-clock{font:700 29px/1 var(--disp);letter-spacing:-.3px;margin-top:4px}
.m-shift-end{display:flex;align-items:center;gap:10px}
.m-due-total{
  text-align:right;background:none;border:0;padding:0;cursor:pointer;color:inherit;
  font-family:var(--sans);
}
.m-due-total span{font:700 10px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--d-muted)}
.m-due-total b{display:block;font:700 19px var(--sans);color:var(--lime);margin-top:2px}

/* Venue counters. The pitch strip that used to sit here repeated what the
   slabs below now state outright, so this counts the shift instead. */
.m-counts{display:flex;gap:6px;margin-top:10px}
.m-count{
  flex:1;min-width:0;display:flex;align-items:baseline;justify-content:center;gap:5px;
  background:var(--field);border-radius:12px;padding:7px 6px;
  font:600 10.5px var(--sans);color:var(--d-muted);white-space:nowrap;overflow:hidden;
}
.m-count b{font:700 14.5px var(--sans);color:#fff}
.m-count.is-play b{color:var(--lime)}
.m-count.is-warn b{color:var(--amber-on-dark)}

/* ─── back header (pushed screens) ────────────────────── */
.m-bar{
  background:var(--paper);border-bottom:1px solid var(--edge);
  padding:calc(14px + var(--safe-t)) 16px 12px;display:flex;align-items:center;gap:12px;
}
.m-back{
  flex:none;width:42px;height:42px;border-radius:14px;border:1px solid var(--edge2);
  background:var(--soft);cursor:pointer;display:grid;place-items:center;
}
.m-bar-txt{min-width:0}
.m-bar-txt small{
  display:block;font:700 10.5px var(--sans);letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted2);
}
.m-bar-txt h1{font:700 26px/1 var(--disp);margin-top:2px}

/* ─── cells on the board ──────────────────────────────── */
/* Every cell is the same box at the same height as its row. Far from the now
   line that box is a bubble; on the row the line is crossing it becomes the
   control for whatever is booked there. Nothing moves sideways when it changes
   face — only the row's height changes, so the grid never jumps under a thumb. */
.m-cell{
  position:relative;height:var(--cell-h);border-radius:15px;
  font-family:var(--sans);text-align:left;
}
.m-cellface{
  position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:inherit;
  background:none;color:inherit;cursor:pointer;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  padding:8px 5px 41px;text-align:center;
}

/* Where a booking came from: present, never competing. */
.m-src{
  flex:none;font:700 9.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted2);opacity:.75;
}

/* ── the tray ──
   One bar across the base rather than a chip in a corner. The corner is where
   nothing looks, and this is the action the cell exists to offer. */
.m-tray{position:absolute;z-index:3;left:5px;right:5px;bottom:5px;display:flex;gap:4px}
.m-cta{
  flex:1 1 auto;min-width:0;height:31px;border:0;border-radius:11px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  background:var(--lime);color:var(--on-accent);font:700 10.5px var(--sans);
  padding:0 5px;
}
.m-cta>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-cta>i{flex:none;display:grid;place-items:center;width:14px;height:14px}
.m-cta>i svg{width:14px;height:14px}
.m-cta.is-icon{flex:none;width:26px;padding:0}
.m-cta.is-quiet{background:var(--soft);color:var(--body)}
.m-cta.is-paper{background:#fff;color:var(--owed)}
/* Why the tray has no button: the pitch is not free. */
.m-tray-note{
  flex:1;min-width:0;height:31px;border-radius:11px;background:var(--soft);
  display:flex;align-items:center;justify-content:center;padding:0 6px;
  font:600 9.5px var(--sans);color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ── arriving / checked in ──
   The planning detail demotes to a caption and the cue takes the card: at a
   glance from three metres you should get "this one is at the gate". */
.m-cell.is-face{background:var(--paper);border:1.5px solid var(--lime-deep)}
.m-cell.is-face.is-ready{background:var(--lime-pale)}
.m-face-tag{font:700 8px var(--sans);letter-spacing:.16em;color:var(--muted2)}
.m-face-top{font:600 10px var(--sans);color:var(--body)}
.m-face-cue{
  font:700 15px/.98 var(--disp);letter-spacing:.02em;text-transform:uppercase;
  margin-top:2px;
}
.m-face-sub{
  max-width:100%;font:500 9.5px var(--sans);color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ── running ──
   The count is the whole card, so the two controls sit under it rather than
   flanking it — at 87px a clock between two circles has nowhere left to be. */
.m-cell.is-timer{background:var(--fill-deep);color:#fff}
.m-cell.is-timer .m-cellface{padding-bottom:44px}
.m-tm-top{
  display:inline-flex;align-items:center;gap:4px;
  font:700 9px var(--sans);color:var(--amber);white-space:nowrap;
}
.m-tm-top svg{width:9px;height:9px;flex:none}
.m-tm-count{
  font:800 27px/1.02 var(--sans);letter-spacing:-.6px;color:#fff;
  font-variant-numeric:tabular-nums;
}
.m-tm-count i{font-style:normal;font-size:.44em;font-weight:600;letter-spacing:0;opacity:.62}
.m-tm-count.is-over{color:var(--red)}
.m-tm-sub{
  max-width:100%;font:500 9.5px var(--sans);color:var(--d-muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.m-tm-acts{
  position:absolute;z-index:3;left:0;right:0;bottom:7px;
  display:flex;align-items:center;justify-content:center;gap:9px;
}
.m-tm-btn{
  width:31px;height:31px;border-radius:50%;border:0;cursor:pointer;
  background:var(--chrome);color:#fff;display:grid;place-items:center;
}
.m-tm-btn svg{width:14px;height:14px}
.m-tm-btn.is-end{background:var(--end-bg);color:var(--red)}
.m-tm-btn.is-go{background:var(--lime);color:var(--on-accent)}

/* A held clock is still the card's whole content, but it is not counting — so
   it recedes rather than shouting a number that is not moving. */
.m-cell.is-timer.is-paused .m-tm-count{color:var(--d-body)}
.m-cell.is-timer.is-paused .m-tm-top{color:var(--d-muted)}
.m-cell.is-timer.is-paused .m-ring-fill{stroke:#4E545B;transition:none}

/* The ring is the card's own outline, not a bar inside it — the countdown and
   how far through it is are one object. */
.m-ring{position:absolute;inset:0;width:100%;height:100%;fill:none;pointer-events:none}
.m-ring rect{x:1.75px;y:1.75px;width:calc(100% - 3.5px);height:calc(100% - 3.5px);rx:14px;stroke-width:3.5}
/* The track has to be visible or the amber arc reads as a stray line beside the
   card rather than as the part of a ring that has filled. */
.m-ring-track{stroke:#383D43}
.m-ring-fill{stroke:var(--amber);stroke-linecap:round;transition:stroke-dasharray .9s linear}
.m-cell.is-timer.is-over{background:var(--over-fill)}
.m-cell.is-timer.is-over .m-ring-track{stroke:#6B2A23}
.m-cell.is-timer.is-over .m-ring-fill{stroke:var(--red);transition:none}
.m-cell.is-timer.is-over .m-tm-top{color:var(--red)}
.m-cell.is-timer.is-over .m-tm-btn{background:#6B2A23}
.m-cell.is-timer.is-over .m-tm-btn.is-end{background:var(--red);color:#fff}

/* ── ended, still owing ──
   Not a booking any more, a debt. The figure to collect is the largest thing
   on it; the kind tag and the phone number give way to the amount. */
.m-cell.is-owed{background:var(--owed);color:#fff}
.m-owed-top b{
  display:inline-block;padding:2px 8px;border-radius:999px;background:#fff;color:var(--owed);
  font:700 8px var(--sans);letter-spacing:.1em;text-transform:uppercase;
}
.m-owed-sum{font:800 21px/1.05 var(--sans);letter-spacing:-.4px;margin-top:3px}
.m-owed-who{
  max-width:100%;font:700 11px var(--sans);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.m-owed-when{font:500 9px var(--sans);opacity:.82}

/* ── booked, but nothing to do about it yet ── */
.m-cell.is-plain{
  background:var(--paper);border:1px solid var(--edge);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:8px 6px;overflow:hidden;
}
/* Same two colours a booked bubble wears, so an hour does not change colour
   just because its row happened to open. */
.m-cell.is-plain.is-app{background:var(--lime);border-color:var(--lime-deep);color:var(--on-accent)}
.m-cell.is-plain.is-counter{background:var(--fill-deep);border-color:var(--fill-deep);color:var(--on-fill)}
.m-cell.is-plain.is-counter .m-face-top,
.m-cell.is-plain.is-counter .m-plain-foot{color:var(--d-body)}
.m-cell.is-plain.is-settled{opacity:.62}
.m-plain-who{
  max-width:100%;font:700 12.5px var(--sans);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.m-plain-foot{
  display:flex;align-items:baseline;gap:5px;
  font:600 9.5px var(--sans);color:var(--amber-txt);
}

/* progress */
.m-track{height:8px;border-radius:5px;background:var(--rule);overflow:hidden}
.m-track i{display:block;height:100%;border-radius:5px;background:var(--done);transition:width .4s}
.m-acts{display:flex;gap:8px}

.m-empty{
  background:var(--paper);border:1.5px dashed var(--edge2);border-radius:22px;
  padding:18px;font:500 13.5px var(--sans);color:var(--body);
}

/* ─── tags ────────────────────────────────────────────── */
.m-tag{
  display:inline-flex;align-items:center;border-radius:999px;padding:5px 11px;
  font:700 11px var(--sans);letter-spacing:.04em;white-space:nowrap;
  background:var(--soft);color:var(--body);
}
.m-tag.is-play{background:var(--lime);color:var(--on-accent)}
.m-tag.is-good{background:var(--lime-tint2);color:var(--lime-txt)}
.m-tag.is-warn{background:var(--paper);color:var(--amber-txt)}
.m-tag.is-warn2{background:var(--amber-bg);color:var(--amber-txt)}
.m-tag.is-dim{background:var(--chrome);color:var(--d-body)}
.m-tag.is-hold{background:var(--lime-pale);color:var(--lime-txt3)}


/* ─── buttons ─────────────────────────────────────────── */
.m-btn{
  flex:1;min-width:0;height:48px;border-radius:16px;border:0;cursor:pointer;
  font:700 14.5px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;justify-content:center;text-decoration:none;
  background:var(--soft);color:var(--ink);
}
.m-btn.is-lime{background:var(--lime);color:var(--on-accent)}
.m-btn.is-ink{background:var(--raise);color:var(--on-fill)}
.m-btn.is-dark{background:var(--chrome);color:#fff}
.m-btn.is-outline{background:transparent;border:1.5px solid var(--edge3);color:var(--ink)}
.m-btn.is-ghost{background:transparent;border:1px solid #3A3F45;color:var(--d-body)}
.m-btn.is-wide{width:100%;flex:none}
.m-btn.is-tall{height:54px;font-size:15.5px}
.m-btn.is-narrow{flex:none;width:78px}
.m-btn.is-mid{flex:none;width:92px}
.m-btn.is-slim{flex:none;width:auto;height:40px;padding:0 16px;font-size:13.5px;border-radius:13px}
.m-btn[disabled]{background:var(--chrome);color:var(--d-muted);cursor:not-allowed}

/* ─── today, as a list ─────────────────────── */
.m-opts.is-wrap{flex-wrap:wrap}
.m-opts.is-wrap .m-opt{flex:1 1 28%}
.m-trow{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;
  padding:12px 13px;border-radius:20px;background:var(--paper);border:1px solid var(--edge);
  color:var(--ink);font-family:var(--sans);
}
.m-trow.is-live{background:var(--raise);border-color:var(--raise);color:var(--on-fill)}
.m-trow.is-due{background:var(--amber-bg);border-color:var(--amber-line)}
.m-trow-when{flex:none;width:56px;text-align:center}
.m-trow-when b{display:block;font:700 14px var(--sans)}
.m-trow-when small{display:block;font:600 10px var(--sans);color:var(--muted);margin-top:1px}
.m-trow.is-live .m-trow-when small{color:var(--d-muted)}
.m-trow-mid{flex:1;min-width:0}
.m-trow-mid b{
  display:block;font:700 14.5px var(--sans);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.m-trow-mid small{
  display:block;font:500 11.5px var(--sans);color:var(--muted);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.m-trow.is-live .m-trow-mid small{color:var(--d-body)}
.m-trow.is-due .m-trow-mid small{color:var(--amber-txt)}
.m-trow-end{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.m-trow-end small{font:700 10.5px var(--sans);color:var(--muted)}
.m-trow.is-due .m-trow-end small{color:var(--amber-txt)}
.m-trow.is-live .m-trow-end small{color:var(--lime)}

 .m-board .m-filters{flex-wrap:nowrap}
.m-board .m-filter{flex:1 1 0;padding:0 4px;height:34px}

/* One pitch across seven days. The hour gutter is gone: every tile names its
   own hour, which is what the gutter was for, and its 42px buys the width that
   makes the label fit. */
.m-board.is-week .m-cols,
.m-board.is-week .m-hour{grid-template-columns:repeat(var(--ncols,7),minmax(0,1fr));gap:4px}
.m-board.is-week .m-hour{--cell-h:40px}
.m-board.is-week .m-col{padding:4px 2px 5px;border-radius:9px}
.m-board.is-week .m-col b{font-size:10px;letter-spacing:-.2px}
.m-board.is-week .m-col small{font-size:11px;color:var(--on-accent);letter-spacing:0}
.m-bub.is-week{padding:0 2px;border-radius:8px;gap:0}
.m-bub.is-week b{font:700 10px/1.1 var(--sans)}
.m-bub.is-week em{font:600 8px/1.1 var(--sans);opacity:.66}

/* Alternate columns take a faint band so the eye has a rail to run down
   instead of counting tiles across. Only the open ones — the others already
   carry a colour that means something. */
.m-board.is-week .m-hour > :nth-child(even).is-free{background:var(--band)}

/* The dates again, at the head of every band. */
.m-hour.is-restate{--cell-h:auto;padding:1px 0 3px}
.m-hour.is-restate span{
  text-align:center;font:700 8.5px var(--sans);letter-spacing:.02em;color:var(--muted2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ─── the bottom nav ────────────────────────────────────────────── */
.m-nav{
  background:var(--paper);border-top:1px solid var(--edge);
  padding:7px 6px calc(9px + var(--safe-b));
  display:grid;grid-template-columns:repeat(5,1fr);gap:2px;
}
.m-nav-item{
  position:relative;min-width:0;border:0;background:none;cursor:pointer;border-radius:14px;
  padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--muted);font:600 10px var(--sans);
}
.m-nav-item i{display:grid;place-items:center;width:22px;height:22px}
.m-nav-item i svg{width:20px;height:20px}
.m-nav-item span{
  max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em;
}
/* The current destination is ink on lime — the one place on the nav with a
   colour, so the answer to "where am I" needs no reading. */
.m-nav-item.is-on{background:var(--lime);color:var(--on-accent);font-weight:700}
.m-nav-badge{
  position:absolute;top:2px;right:calc(50% - 21px);min-width:16px;height:16px;padding:0 4px;
  border-radius:999px;background:var(--red);color:#fff;
  font:700 9.5px/16px var(--sans);font-style:normal;text-align:center;
  border:1.5px solid var(--paper);
}
.m-nav-item.is-on .m-nav-badge{border-color:var(--lime)}

/* Money you could take right now, above the nav rather than behind a tab. */
.m-collect-bar{
  display:flex;align-items:center;gap:10px;width:100%;cursor:pointer;
  padding:13px 16px calc(13px);border:0;border-top:1px solid var(--edge);
  background:var(--raise);color:var(--on-fill);font-family:var(--sans);text-align:left;
}
.m-collect-bar i{flex:none;display:grid;place-items:center;color:var(--lime)}
.m-collect-bar i svg{width:20px;height:20px}
.m-collect-bar span{flex:1;min-width:0;font:700 16px var(--sans);white-space:nowrap;overflow:hidden}
.m-collect-bar em{
  flex:none;font:600 11px var(--sans);font-style:normal;color:var(--d-muted);
}

/* ─── the board ───────────────────────────────────────── */
/* Side padding is 12px, not 16 — every pixel taken off the frame goes into the
   three columns, and a card at 87px has none to spare. */
.m-board{padding:0 12px 22px;display:flex;flex-direction:column;gap:8px}
/* One line, not two. Stacked, seven of these ran to 62px of chrome above a
   grid that had not started yet. */
.m-days{
  display:flex;gap:6px;overflow-x:auto;padding:0 12px 2px;margin:0 -12px;
  scrollbar-width:none;
}
.m-days::-webkit-scrollbar{display:none}
.m-day{
  flex:none;height:34px;padding:0 11px;border-radius:12px;cursor:pointer;
  display:flex;align-items:baseline;gap:4px;
  border:1.5px solid var(--edge3);background:var(--paper);color:var(--ink);
}
.m-day small{font:600 9.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;opacity:.62}
.m-day b{font:700 14px var(--sans)}
.m-day.is-on{background:var(--fill-deep);border-color:var(--fill-deep);color:var(--on-fill)}

.m-walkin{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  padding:9px 13px;border-radius:16px;border:1.5px dashed var(--edge3);
  background:var(--paper);color:var(--ink);
}
.m-walkin>span{min-width:0}
.m-walkin b{display:block;font:700 14px var(--sans)}
.m-walkin small{display:block;font:500 11.5px var(--sans);color:var(--muted);margin-top:2px}
.m-walkin em{
  flex:none;margin-left:auto;font:700 10.5px var(--sans);letter-spacing:.1em;
  font-style:normal;color:var(--lime-txt);
}

.m-legend{
  display:flex;flex-wrap:wrap;gap:10px 14px;padding:12px 14px;
  background:var(--paper);border:1px solid var(--edge);border-radius:20px;
}
.m-legend span{display:inline-flex;align-items:center;gap:7px;font:600 12px var(--sans)}
.m-legend i{width:13px;height:13px;border-radius:4px;display:block;border:1px solid var(--edge2)}
.m-legend i.is-app{background:var(--lime);border-color:var(--lime-deep)}
.m-legend i.is-counter{background:var(--fill-deep);border-color:var(--fill-deep)}
.m-legend i.is-hold{background:var(--lime-tint);border-color:var(--lime-tint)}
.m-legend i.is-blocked{background:var(--soft)}
.m-legend i.is-open{background:var(--paper)}
.m-legend em{width:100%;font:500 12px var(--sans);color:var(--muted);font-style:normal}

/* The column head is locked to the top while the hours run under it. On the
   page ground it read as three loose words, so it takes a band: paper, a rule
   under it, and a shadow the rows visibly pass beneath. The negative margin and
   the matching inner padding are what hold its columns over the cells — change
   one and you must change the other. */
.m-cols{
  position:sticky;top:0;z-index:6;
  margin:0 -12px;padding:6px 12px 7px;
  /* The board's own ground, not a bar of its own: the chips are what you see,
     and they read as the top of the grid rather than as a strip above it. It
     still has to be opaque, because rows scroll underneath it. */
  background:var(--page);
  display:grid;grid-template-columns:var(--gutter) repeat(var(--ncols,3),minmax(0,1fr));gap:7px;align-items:end;
}
/* The gutter used to say "Time", which the hour labels under it already do.
   It says which day instead — the one thing the day chips took with them when
   they stopped being pinned. */
.m-cols-day{
  font:700 9.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink);text-align:right;align-self:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* The week has no gutter, so the pitch takes a line of its own across the top
   of the head — it is the fact seven date columns cannot state. */
.m-cols-pitch{
  /* Ink, not lime: --lime-txt on the pale page is 3.6:1 at this size, and the
     row of lime date chips directly under it already carries the accent. */
  grid-column:1 / -1;font:700 10px var(--sans);letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink);padding-bottom:1px;
}
/* The band is ink so the heads read as chrome rather than as one more row of
   the grid — that is what separates them, so the name can simply be the name. */
/* The accent, so the one row naming the pitches is the one row wearing the
   brand's colour. It does share a fill with an app booking, which is why the
   head keeps its own row above the grid, its own radius and its own type scale:
   the separation is positional, not chromatic. Lime is the same hex in both
   themes, so this head needs no dark value of its own. */
.m-col{
  min-width:0;text-align:center;border-radius:11px;background:var(--head);
  padding:4px 4px 5px;border:0;
}
.m-col b{
  display:block;font:700 12.5px var(--sans);color:var(--on-accent);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.m-col small{
  display:block;font:600 8.5px var(--sans);letter-spacing:.04em;text-transform:uppercase;
  color:rgba(22,24,28,.66);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.m-band{display:flex;flex-direction:column;gap:5px}
.m-band-head{
  display:flex;align-items:center;gap:9px;width:100%;height:37px;padding:0 11px;
  border-radius:14px;cursor:pointer;background:var(--soft2);border:1px solid var(--edge);color:var(--ink);
}
.m-band-head.is-closed{background:var(--soft)}
.m-chev{
  flex:none;width:20px;height:20px;border-radius:50%;background:var(--edge);
  display:grid;place-items:center;font-style:normal;font-size:9px;color:var(--body);
}
.m-band-head b{font:700 12.5px var(--sans);letter-spacing:.12em;text-transform:uppercase}
.m-rule{flex:1;min-width:8px;height:1px;background:var(--edge2)}
.m-band-span{flex:none;font:600 10.5px var(--sans);color:var(--muted2);white-space:nowrap}
.m-band-head em{
  flex:none;font:700 10px var(--sans);letter-spacing:.08em;font-style:normal;color:var(--body);
}

/* One row per hour. Its height is the only thing that changes when the now line
   arrives, so nothing shifts sideways under a thumb. */
.m-hour{
  --cell-h:46px;position:relative;
  display:grid;grid-template-columns:var(--gutter) repeat(var(--ncols,3),minmax(0,1fr));gap:6px;align-items:center;
}
.m-hour.is-open{--cell-h:138px}
.m-hourlbl{
  text-align:right;font:700 9.5px var(--sans);color:var(--body);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
/* The line's own label takes the gutter for that one row. */
.m-hour.has-now .m-hourlbl{opacity:0}

.m-bub{
  height:var(--cell-h);width:100%;border-radius:15px;cursor:pointer;padding:0 4px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border:1px solid var(--edge2);background:var(--paper);color:var(--ink);
  white-space:nowrap;overflow:hidden;
}
.m-bub b{font:700 12.5px/1 var(--sans)}
/* The channel rides with the status word rather than taking a line of its own —
   an 87px cell has room for one secondary line, not two. */
.m-bub em{font:600 9.5px/1 var(--sans);font-style:normal;letter-spacing:.04em;opacity:.72}
.m-bub.is-tall b{font-size:15px}
.m-bub.is-booked.is-app{background:var(--lime);border-color:var(--lime-deep);color:var(--on-accent)}
.m-bub.is-booked.is-counter{background:var(--fill-deep);border-color:var(--fill-deep);color:var(--on-fill)}
.m-bub.is-hold{background:var(--lime-tint);border-color:var(--lime-tint);color:var(--lime-txt3)}
.m-bub.is-blocked{background:var(--soft);border-color:var(--soft);color:var(--muted2)}
.m-bub.is-blocked b{text-decoration:line-through}
.m-bub.is-sel{box-shadow:0 0 0 2.5px var(--ink)}

/* ── the live line ──
   Red, because it is the one thing on the board that is not a booking. It rides
   the row it is inside, positioned by the minute, and carries the clock time in
   the gutter so the row it has reached needs no arithmetic. */
.m-now{
  position:absolute;z-index:5;left:calc(var(--gutter) + 7px);right:0;
  top:calc(var(--frac) * 100%);height:2px;border-radius:999px;background:var(--red);
  pointer-events:none;
}
.m-now::before{
  content:"";position:absolute;left:-4px;top:50%;width:9px;height:9px;border-radius:50%;
  background:var(--red);transform:translateY(-50%);
}
/* The line crosses everything, cards included. It was tucked behind them so it
   would not cut a countdown in half, but on an open row that left it showing
   only in the gutter and two 7px gaps — which is not a line anyone can see. It
   carries a light halo so it reads as something laid over the card rather than
   a rule struck through it. */
.m-hour.is-open .m-cell,.m-hour.is-open .m-bub{position:relative;z-index:2}

.m-now-lbl{
  position:absolute;right:calc(100% + 9px);top:50%;transform:translateY(-50%);
  padding:2px 5px;border-radius:6px;background:var(--paper);color:var(--red);
  font:700 9.5px/1 var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap;
  box-shadow:0 0 0 1px var(--edge2);
}

/* ─── forms on dark ───────────────────────────────────── */
.m-pad{padding:14px 16px 26px;display:flex;flex-direction:column;gap:14px}
.m-panel{background:var(--raise);color:var(--on-fill);border-radius:24px;padding:18px 16px}
.m-label{
  display:block;font:700 10px var(--sans);letter-spacing:.1em;text-transform:uppercase;
  color:var(--d-muted);margin-bottom:6px;
}
/* Any label that is not the first thing in its panel needs air above it —
   otherwise a field caption sits flush against the row before it. */
*+.m-label,.m-label.is-spaced{margin-top:14px}
.m-field{
  width:100%;background:var(--field);border:0;border-radius:16px;padding:14px;
  color:#fff;font:600 15px var(--sans);outline:none;
}
input.m-field[type=time]{font:700 17px var(--sans);color-scheme:dark}
.m-field::placeholder{color:#6C737B}
.m-opts{display:flex;gap:7px}
.m-opt{
  flex:1;min-width:0;height:42px;border-radius:13px;border:0;cursor:pointer;padding:0 6px;
  font:600 12.5px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:var(--field);color:var(--d-muted);
}
.m-opt.is-on{background:var(--on-fill);color:var(--on-accent);font-weight:700}

/* .m-opt is dressed for a dark sheet — a dark pill with grey type. Put that on
   the light page and every unselected filter reads as a disabled button. On the
   page they take the day-chip treatment instead: paper with an ink outline,
   filled ink when chosen. */
.m-filters{display:flex;flex-wrap:wrap;gap:7px}
.m-filter{
  flex:1 1 28%;min-width:0;height:40px;padding:0 8px;border-radius:13px;cursor:pointer;
  border:1.5px solid var(--edge3);background:var(--paper);color:var(--body);
  font:600 12.5px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.m-filter.is-on{background:var(--fill-deep);border-color:var(--fill-deep);color:var(--on-fill);font-weight:700}
/* A choice that has to state the minute it would use needs two lines — and a
   button is inline-block by default, so it needs to be told it is a column. */
.m-opt.is-two{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;height:54px;
}
.m-opt.is-two b{font:700 12.5px var(--sans)}
.m-opt.is-two i{font:600 11px var(--sans);font-style:normal;opacity:.72}
.m-opt[disabled]{opacity:.45;cursor:not-allowed}

.m-stepper{display:flex;align-items:center;gap:9px}
.m-step{
  flex:none;width:46px;height:46px;border-radius:15px;border:0;cursor:pointer;
  background:var(--field);color:#fff;font:700 20px/1 var(--sans);
}
.m-step[disabled]{opacity:.35;cursor:not-allowed}
.m-stepper-now{
  flex:1;height:46px;border-radius:15px;background:var(--chrome);color:#fff;
  display:grid;place-items:center;font:700 17px var(--sans);font-variant-numeric:tabular-nums;
}
.m-quote{font:700 17px var(--sans);color:var(--lime);margin-top:12px}
.m-hr{border-top:1px solid var(--chrome);margin:14px 0}
.m-banner{
  background:var(--lime-tint2);border:1px solid var(--lime-deep);border-radius:20px;
  padding:15px 16px;font:700 14px var(--sans);color:var(--lime-txt);
}

/* ─── signing in, and when the server says no ──────── */
.m-auth{
  min-height:100%;display:grid;place-items:center;
  padding:calc(24px + var(--safe-t)) 18px calc(24px + var(--safe-b));
}
.m-auth-card{
  width:100%;max-width:360px;background:var(--raise);color:var(--on-fill);border-radius:26px;padding:22px 20px 24px;
}
.m-mark{
  width:46px;height:46px;border-radius:15px;background:var(--lime);color:var(--on-accent);
  display:grid;place-items:center;font:700 17px var(--disp);letter-spacing:.06em;margin-bottom:16px;
}
.m-auth-card h1{font:700 30px/1.05 var(--disp);letter-spacing:-.3px;margin:4px 0 0}
.m-auth-card p{font:500 13px/1.5 var(--sans);color:var(--d-body);margin:6px 0 4px}
.m-auth-card .m-btn{margin-top:16px}

/* A phone loses signal in a stairwell. A write that failed has to say so, not
   leave a button looking as though it worked. */
.m-alert{
  margin-top:14px;padding:11px 13px;border-radius:14px;
  background:var(--amber-bg);border:1px solid var(--amber-line);
  font:600 12.5px/1.45 var(--sans);color:var(--amber-txt);
}
.m-alert.is-page{margin:14px 12px 0}

/* ─── money ─────────────────────────────── */
/* The number a shift ends on, at the size a number that gets counted against
   deserves. Its per-tender split sits under it because that is how a till is
   actually reconciled — one drawer, three tenders, three figures to match. */
.m-till{font:800 34px/1 var(--sans);letter-spacing:-.8px;color:var(--lime);margin-top:6px}
.m-till.is-due{color:var(--amber-on-dark)}
.m-quote small{display:block;font:500 11.5px var(--sans);color:var(--lime-txt3);margin-top:3px}

.m-mrow{
  display:flex;flex-direction:column;gap:5px;padding:13px 14px;border-radius:20px;
  background:var(--paper);border:1px solid var(--edge);
}
.m-mrow.is-due{background:var(--amber-bg);border-color:var(--amber-line)}
.m-mrow-top{display:flex;align-items:center;gap:9px}
.m-mrow-top b{
  flex:1;min-width:0;font:700 15.5px var(--sans);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* An amber pill on an amber row is not a pill. */
.m-mrow.is-due .m-tag{background:var(--paper);color:var(--amber-txt)}
.m-mrow-sub{font:500 12px var(--sans);color:var(--body)}
.m-mrow.is-due .m-mrow-sub{color:var(--amber-txt)}
.m-mrow-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:3px}
.m-mrow-foot>span{
  min-width:0;font:600 12px var(--sans);color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.m-mrow.is-due .m-mrow-foot>span{color:var(--amber-txt)}

/* Payment events behind a balance. The ledger is append-only, so a corrected
   row shows both the payment and the reversal rather than a netted figure. */
.m-mrow-hist{
  min-width:0;display:flex;align-items:baseline;gap:6px;padding:0;border:0;background:none;
  cursor:pointer;font:600 12px var(--sans);color:var(--muted);text-align:left;
}
.m-mrow.is-due .m-mrow-hist{color:var(--amber-txt)}
.m-mrow-hist em{font:700 10.5px var(--sans);font-style:normal;color:var(--body);white-space:nowrap}
.m-hist{
  display:flex;flex-direction:column;gap:4px;margin-top:9px;padding-top:9px;
  border-top:1px solid var(--edge2);
}
.m-mrow.is-due .m-hist{border-top-color:var(--amber-line)}
.m-hist-row{display:flex;align-items:baseline;gap:8px;font-family:var(--sans)}
.m-hist-row b{flex:none;width:64px;font:700 12px var(--sans);color:var(--lime-txt)}
.m-hist-row.is-back b{color:var(--red)}
.m-hist-row span{flex:none;font:600 11px var(--sans);color:var(--body)}
.m-hist-row em{
  flex:1;min-width:0;font:500 11px var(--sans);font-style:normal;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.m-hist-none{font:500 11.5px var(--sans);color:var(--muted)}

/* A settled cell keeps a chip, so its face stops short of the tray. */
.m-cellface.is-flat{padding:8px 6px 40px;justify-content:center}
.m-cta.is-quiet{background:var(--soft);color:var(--body)}
.m-cell.is-plain.is-counter .m-cta.is-quiet{background:var(--chrome);color:#fff}
.m-btn.is-outline.is-slim{border:1.5px solid var(--edge3);background:transparent}
.m-mrow.is-due .m-btn.is-outline.is-slim{border-color:var(--amber-line);color:var(--amber-txt)}

/* ─── reminders ───────────────────────────────────────── */
.m-groups{padding:14px 16px 26px;display:flex;flex-direction:column;gap:18px}
.m-group{display:flex;flex-direction:column;gap:10px}
.m-group-head{display:flex;align-items:baseline;gap:8px}
.m-group-head h2{font:700 22px/1 var(--disp)}
.m-group-head span{font:600 12.5px var(--sans);color:var(--muted)}
.m-rem{background:var(--paper);border:1px solid var(--edge);border-radius:20px;padding:14px 16px}
.m-rem.is-cash{background:var(--amber-bg);border-color:var(--amber-line)}
.m-rem-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.m-rem-top b{font:700 14px var(--sans)}
.m-rem-top span{font:500 12px var(--sans);color:var(--muted)}
.m-rem h3{font:700 16px var(--sans);margin:7px 0 0}
.m-rem p{font:500 12.5px/1.5 var(--sans);color:var(--body);margin-top:3px}
.m-rem .m-btn{margin-top:12px}
.m-lede{font:400 13px/1.55 var(--sans);color:var(--body);margin:7px 0 0}

/* ─── sheets ──────────────────────────────────────────── */
.m-sheet{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;justify-content:flex-end}
.m-scrim{position:absolute;inset:0;border:0;background:rgba(16,18,20,.5);backdrop-filter:blur(2px);cursor:pointer}
.m-sheet-card{
  position:relative;background:var(--raise);color:var(--on-fill);border-radius:30px 30px 0 0;
  padding:12px 18px calc(30px + var(--safe-b));max-height:90%;overflow-y:auto;
}
/* Only on the way in. A repaint is not an opening. */
.m-sheet-card.is-new{animation:m-rise .22s ease-out}
@keyframes m-rise{from{transform:translateY(18px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.m-sheet-card.is-new{animation:none}}
.m-grip{width:44px;height:4px;border-radius:3px;background:#3A3F45;margin:0 auto 14px}
.m-sheet-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.m-kick{font:700 10.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--lime)}
.m-x{
  width:36px;height:36px;border-radius:50%;background:var(--chrome);color:#fff;border:0;
  cursor:pointer;font:700 16px var(--sans);flex:none;
}
.m-sheet-title{font:700 34px/1.05 var(--disp);letter-spacing:-.4px;margin-top:12px}
.m-sheet-sub{font:500 13px var(--sans);color:var(--d-body);margin-top:5px}
.m-kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;font:500 14px var(--sans)}
.m-kv span{color:var(--d-muted)}
.m-kv b{text-align:right}
.m-kvs{border-top:1px solid var(--chrome);margin-top:16px;padding-top:4px}
.m-stack{display:flex;flex-direction:column;gap:9px;margin-top:18px}
.m-foot-note{
  display:block;width:100%;background:none;border:0;text-align:center;margin-top:12px;
  font:600 12.5px var(--sans);color:var(--d-muted);text-decoration:underline;
  text-underline-offset:3px;cursor:pointer;
}
/* UPI block — the phone is turned around and shown to the customer, so it is
   the one thing on a dark sheet that goes full lime. */
.m-upi{background:var(--lime);border-radius:24px;padding:20px 18px;margin-top:16px;text-align:center}
.m-qr{
  width:136px;height:136px;margin:0 auto;border-radius:12px;
  border:6px solid var(--on-accent);box-sizing:content-box;background-blend-mode:multiply;
  background:
    conic-gradient(from 0deg at 25% 25%, var(--on-accent) 0 25%, transparent 0 100%),
    repeating-linear-gradient(90deg, var(--on-accent) 0 8px, transparent 8px 16px),
    repeating-linear-gradient(0deg, var(--on-accent) 0 8px, transparent 8px 16px);
}
.m-upi b{display:block;font:700 15px var(--sans);color:var(--on-accent);margin-top:10px}
.m-upi span{display:block;font:500 12.5px var(--sans);color:var(--lime-on-lime);margin-top:2px}

/* ═══ SCREEN: settings ═════════════════════════════════ */
/* Pale cards on the pale page, like the money screen — this is a reading
   screen with a few switches on it, not a form. */
.m-set{display:flex;flex-direction:column;gap:12px;padding:14px 12px 22px}
.m-card{background:var(--paper);border:1px solid var(--edge);border-radius:20px;padding:14px 14px 16px}
.m-card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px}
.m-card-head h2{font:700 15px var(--sans);letter-spacing:-.1px}
.m-card-head span{font:600 10px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted2)}
.m-card p{font:500 12.5px/1.45 var(--sans);color:var(--body);margin-top:6px}
.m-card .m-filters{margin-top:12px}
/* A row that opens something else: the label, a value, a chevron. */
.m-setrow{
  display:flex;align-items:center;gap:10px;width:100%;cursor:pointer;text-align:left;
  background:none;border:0;border-top:1px solid var(--rule);padding:12px 0 11px;
  font-family:var(--sans);color:inherit;
}
.m-setrow:first-of-type{border-top:0}
.m-setrow-txt{flex:1;min-width:0}
.m-setrow-txt b{display:block;font:700 13.5px var(--sans)}
.m-setrow-txt small{display:block;font:500 11.5px/1.4 var(--sans);color:var(--muted);margin-top:2px}
.m-setrow-val{flex:none;font:700 13px var(--sans);color:var(--body)}
.m-setrow-val.is-warn{color:var(--owed-txt)}
.m-setrow i{flex:none;color:var(--muted2);font-style:normal;font-weight:700}
/* The deposit editor: managers get the field, everyone else gets the number. */
.m-money-edit{display:flex;gap:8px;margin-top:10px}
.m-money-edit .m-field{flex:1;min-width:0}
.m-money-edit .m-btn{flex:none;width:auto;padding:0 16px}
/* Fields live in dark panels everywhere else in this app; here one sits on
   paper and has to say where its edges are. */
.m-card .m-field{background:var(--soft2);border:1px solid var(--edge2);color:var(--ink)}
.m-card .m-label{color:var(--muted)}
/* .m-kvs is dressed for a dark sheet: a chrome rule and grey keys. On paper
   the rule goes black and the keys drop to 3:1, so both are restated. */
.m-card .m-kvs{border-top-color:var(--edge)}
.m-card .m-kv span{color:var(--muted)}
.m-card .m-kv{padding:9px 0;font-size:13.5px}
.m-ver{text-align:center;font:500 11px var(--sans);color:var(--muted2);padding:2px 0 6px}

/* The bell moved out of the dock when settings took its place; it belongs on
   the shift header, which is where a count of things needing a decision reads
   as a count rather than a destination. */
.m-bell{
  position:relative;flex:none;width:29px;height:29px;border-radius:50%;
  border:1.5px solid var(--chrome);background:var(--field);color:var(--on-fill);
  display:grid;place-items:center;cursor:pointer;
}
.m-bell svg{width:15px;height:15px}
.m-bell em{
  position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 4px;
  border-radius:999px;background:var(--red);color:#fff;
  font:700 10px/16px var(--sans);font-style:normal;text-align:center;
}

/* ═══════════════════════════════════════════════════════
   DARK MODE — [data-theme="dark"]
   The console's palette, hex for hex (styles.css), because the two are one
   product and a shift that starts at the counter and continues on the phone
   should not change colour on the way. Surfaces step by lightness alone; the
   lime is untouched, being the one thing on screen with a colour.

   The theme attribute is always written by mobile.js — "system" is resolved
   there against prefers-color-scheme rather than duplicating this block under
   a media query.
   ═══════════════════════════════════════════════════════ */
[data-theme="dark"]{
  /* An elevation ladder, darkest at the bottom. Nothing in here is a border
     doing a surface's job — things separate because they are lighter than what
     they sit on, which is the whole grammar of a dark screen. */
  --page:#1B1B1B;           /* the ground */
  --soft2:#1E1E1E;          /* the faintest lift: band heads, a well on a card */
  --paper:#232323;          /* a slot, a card, a row, the nav */
  --soft:#262626;           /* a quiet filled control ON one of those */
  --raise:#0D0D0D;          /* the ink surfaces: header, sheet, panel, collect bar */
  --fill-deep:#0D0D0D;      /* the running clock, and a counter sale */

  --ink:#F4F5F3;            /* the strongest TEXT; the fills are above */
  --body:#C2C6CB;
  --muted:#9298A0;
  --muted2:#8B9199;
  /* The greys that sit on a raised panel. They rise with it: --raise came up a
     rung, and at the old value every field label on a sheet fell to 4.2:1. */
  --d-muted:#A2A8B0;
  --d-body:#C8CCD1;

  /* Borders stop drawing boxes. --edge matches the surface it outlines, so a
     card is a block of colour; only the ones that still carry meaning — the
     ring on an unselected chip — keep a value you can see. */
  --edge:#232323;           /* matches --paper, so a card is a block not a box */
  --edge2:#303030;
  --edge3:#3C3C3C;
  --rule:#282828;
  --chrome:#2E2E2E;         /* a secondary button inside a raised panel */
  --field:#242424;          /* an input well inside one */

  --lime-pale:#232B14;      /* the pale lime surfaces become tinted darks */
  --lime-tint:#2D3818;
  --lime-tint2:#2A3416;
  --lime-txt:#C4E24A;
  --lime-txt3:#B9D653;
  /* A plate for money that is late. Straight off the console it is #33260B,
     which is a saturated brown: on a desk it is one row among many, on a phone
     it is half the screen and reads as dirt. Same hue, most of the saturation
     out, so it sits a step above the card rather than shouting over it — the
     amber that carries the meaning is the type and the tag. */
  --amber-bg:#282017;
  --amber-line:#3D3323;
  --amber-txt:#E8B94A;
  --owed-txt:#F0897C;
  --band:#1A1A1A;           /* the week rail reads as a groove, not a stripe */
  --frame:#111;
  color-scheme:dark;
}
/* Selected chips were an ink fill on a pale ground: the deepest thing on the
   page. Inverted, a near-black chip against lighter siblings reads as the one
   that is switched OFF. The console answered this the same way — the accent
   carries the pressed state in dark, because it is the only value that still
   rises. */
[data-theme="dark"] .m-day.is-on,
[data-theme="dark"] .m-filter.is-on{
  background:var(--lime);border-color:var(--lime);color:var(--on-accent)}
/* The shift bar is a deep ink slab on paper, where the page is pale and the
   contrast is the point. In the dark it is a THIRD value stacked above the
   board — status strip, header, grid — and the eye reads two seams before it
   reaches a single slot. It takes the page instead, so the board begins at the
   top of the screen and the clock and counters sit directly on it. */
[data-theme="dark"] .m-shift{background:var(--page)}

/* On paper the back header is a white bar on a grey page — that contrast is
   what makes it read as a header. In the dark it inverts into a LIGHTER slab
   across the top of a darker board, which is a seam rather than a header, and
   the availability grid wants to start at the top of the screen. So the bar
   takes the page and its rule disappears with it; the title and the back
   button carry the hierarchy on their own. */
[data-theme="dark"] .m-bar{background:var(--page);border-bottom-color:var(--page)}

/* A blocked hour is a hole in the grid. Its fill is --soft, which on paper is
   below the card and in this theme is above it — so here it is stated as its
   own recess rather than borrowed from a control. */
[data-theme="dark"] .m-bub.is-blocked,
[data-theme="dark"] .m-legend i.is-blocked{background:#161616;border-color:#161616}
/* A counter sale is the one bubble darker than the grid it sits in, so it needs
   an edge to stay a bubble rather than a gap. */
[data-theme="dark"] .m-bub.is-booked.is-counter,
[data-theme="dark"] .m-cell.is-plain.is-counter{border-color:#2E2E2E}
/* Raised things cast; on paper this would be grime, in the dark it is the only
   other cue that something is in front. */
[data-theme="dark"] .m-sheet-card{box-shadow:0 -14px 44px rgba(0,0,0,.62)}
[data-theme="dark"] .m-panel,
[data-theme="dark"] .m-card{box-shadow:0 2px 14px rgba(0,0,0,.35)}

</style>
</head>
<body>

<div class="m-phone">
  <div class="m-app">
    <header id="mHeader"></header>
    <div id="mBody"></div>
    <div id="mDock"></div>
  </div>
  <div id="mSheet"></div>
</div>

<script>
/* The whole ERP, with nothing behind it.

   mobile.js is an API client: every read and every write goes through
   fetch(). This replaces fetch for the demonstration build, so the same
   untouched app runs against an object in memory instead of a server.

   Why: on a turf, over a phone hotspot, every tap costs a round trip to
   Cloudflare and back. That latency is the whole impression an owner forms of
   whether the thing is quick. Here a tap is a function call, so the board
   answers in the same frame.

   Nothing is persisted and nothing syncs. A reload is a factory reset, which
   is the behaviour you want from a demonstration: if a tap goes wrong in front
   of an owner, pull down and the board is perfect again.

   The seed is built relative to the clock at load, so the live match is always
   live — whatever hour you walk in. */

(function(){
  'use strict';

  const PITCHES = [
    { name:'Pitch A', rate:1800 },
    { name:'Pitch B', rate:1200 },
    { name:'Main Ground', rate:3200 },
  ];
  const FLOODLIGHT_FROM = 18 * 60, FLOODLIGHT_FEE = 300;
  /* The server's own arithmetic. If this drifts the demo quotes one price and
     the real app bills another, which is the one lie an owner would catch. */
  const priceFor = (pitch, start, end) => Math.round(
    PITCHES[pitch].rate * (end - start) / 60 + (end > FLOODLIGHT_FROM ? FLOODLIGHT_FEE : 0));

  const pad = n => String(n).padStart(2, '0');
  const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const dayAt = off => { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() + off); return d; };
  const dateFor = off => isoOf(dayAt(off));
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2));
  const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };

  const USER = { id:'demo-owner', name:'R. Kumar', email:'owner@futly.app',
    role:'owner', mustChangePassword:false };

  const DB = { bookings:[], holds:[], blocks:[], payments:[], settings:{ depositAmount:500 } };

  /* ── seed ─────────────────────────────────────────────── */
  const LIVE_TEAM = ['Falcon FC', '9847112233'];
  const OWED_TEAM = ['Kakkanad Strikers', '9847709962'];
  const TEAMS = [
    ['Kaloor Kings','9995640182'],     ['Edappally Eagles','8086774510'],
    ['Vyttila Warriors','9744328815'], ['Panampilly FC','9846051127'],
    ['Thrikkakara XI','9633870244'],   ['Marine Drive FC','9961245508'],
    ['Palarivattom FC','9048336721'],  ['Nellikka Boys','9895412067'],
    ['MG Road United','7593008841'],   ['Kadavanthra Lions','9567120934'],
    ['Aluva Athletic','9605778213'],   ['Office Team','9847665031'],
    ['Sunday Regulars','9388221470'],  ['Infopark XI','9496550318'],
    ['Thevara Titans','9847330116'],   ['Cheranalloor FC','9846772204'],
  ];
  let cast = 0;
  const nextTeam = () => TEAMS[cast++ % TEAMS.length];

  /* Mornings are the fitness crowd, the middle of the day is dead, the evening
     is the business. A board that is evenly busy all day looks invented. */
  const DEMAND = {
    6:[1,1,0], 7:[1,1,0], 8:[1,0,0], 15:[0,0,1], 16:[1,0,1], 17:[1,1,1],
    18:[1,1,1], 19:[1,1,1], 20:[1,1,1], 21:[1,1,1], 22:[1,0,0], 23:[1,0,0],
  };
  /* Gaps held open on purpose: a demo needs a free slot to tap. */
  const KEEP_OPEN = { 0:[[0,21],[1,19],[2,17]], 1:[[0,20],[1,18],[2,19],[0,7]], 2:[[1,20],[2,18]] };

  function makeBooking(date, pitch, start, end, team, contact, source){
    return { id:uid(), date, pitch, start, end, team, contact,
      source:source || 'counter', kind:'standard', status:'upcoming',
      startedAt:null, endedAt:null, checkedInAt:null,
      pausedAt:null, pausedMilliseconds:0,
      amount:priceFor(pitch, start, end), discount:0,
      collected:0, collectedByMode:{ Cash:0, UPI:0, Card:0 },
      advance:0, pay:'Payment at venue', version:1,
      createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
  }

  const free = (date, pitch, start, end) => !DB.bookings.some(b =>
    b.date === date && b.pitch === pitch && b.status !== 'cancelled'
    && b.start < end && b.end > start);

  function pay(booking, amount, mode, reference, kind){
    const value = Math.round(amount);
    if (!(value > 0)) return;
    DB.payments.push({ id:uid(), bookingId:booking.id, amount:value, mode,
      kind:kind || 'payment', reference:reference || '',
      reason:'', by:USER.name, createdAt:new Date().toISOString() });
    booking.collected = Math.round((booking.collected || 0) + value);
    booking.collectedByMode[mode] = Math.round((booking.collectedByMode[mode] || 0) + value);
  }

  function seedDay(offset){
    const date = dateFor(offset);
    const open = KEEP_OPEN[offset] || [];
    Object.keys(DEMAND).map(Number).forEach(hour => {
      DEMAND[hour].forEach((wanted, pitch) => {
        if (!wanted) return;
        if (open.some(o => o[0] === pitch && o[1] === hour)) return;
        const start = hour * 60, end = start + 60;
        if (!free(date, pitch, start, end)) return;
        const t = nextTeam();
        DB.bookings.push(makeBooking(date, pitch, start, end, t[0], t[1],
          (pitch + hour) % 3 === 0 ? 'app' : 'counter'));
      });
    });
  }

  function seedHistory(){
    /* Enough settled history that Money and Accounts have something to open. */
    const MODES = ['UPI','Cash','UPI','Card','Cash'];
    let n = 0;
    for (let back = 2; back <= 21; back++){
      const date = dateFor(-back);
      [17,18,19,20,21].forEach((hour, i) => {
        const pitch = (back + i) % 3;
        const t = nextTeam();
        const b = makeBooking(date, pitch, hour * 60, hour * 60 + 60, t[0], t[1],
          (back + i) % 3 === 0 ? 'app' : 'counter');
        b.status = 'done';
        b.startedAt = hour * 60 + 2;
        b.endedAt = hour * 60 + 60;
        DB.bookings.push(b);
        if (n % 9 !== 8){
          const mode = MODES[n % MODES.length];
          pay(b, b.amount, mode, mode === 'Cash' ? '' : 'UTR' + (400000 + n * 13));
        }
        n++;
      });
    }
  }

  function seed(){
    seedHistory();
    [0, 1, 2].forEach(seedDay);

    const NOW = nowMin();
    const today = dateFor(0);
    const liveHour = Math.min(23, Math.max(6, Math.floor(NOW / 60)));
    const liveStart = liveHour * 60;

    /* The match on the clock right now — the single most convincing card on
       the board, so it is placed rather than left to chance. */
    DB.bookings = DB.bookings.filter(b =>
      !(b.date === today && b.pitch === 0 && b.start === liveStart));
    const live = makeBooking(today, 0, liveStart, liveStart + 60, LIVE_TEAM[0], LIVE_TEAM[1], 'app');
    live.status = 'running';
    live.startedAt = Math.max(live.start, Math.min(NOW - 22, live.end - 5));
    live.checkedInAt = new Date().toISOString();
    DB.bookings.push(live);

    /* And one that finished in the last hour without paying, so "still to
       collect" is a real number. */
    const owedStart = Math.max(6 * 60, liveStart - 60);
    if (owedStart < liveStart){
      DB.bookings = DB.bookings.filter(b =>
        !(b.date === today && b.pitch === 2 && b.start === owedStart));
      const owed = makeBooking(today, 2, owedStart, owedStart + 60, OWED_TEAM[0], OWED_TEAM[1], 'counter');
      owed.status = 'done';
      owed.startedAt = owed.start + 3;
      owed.endedAt = owed.end;
      DB.bookings.push(owed);
    }

    /* Everything on today that has already finished gets a life. */
    const MODES = ['UPI','Cash','UPI','Card','Cash','UPI'];
    let settled = 0;
    DB.bookings.filter(b => b.date === today && b.status === 'upcoming').forEach(b => {
      if (b.end <= NOW){
        b.status = 'done';
        b.startedAt = b.start + (b.pitch % 3);
        b.endedAt = b.end;
        if (settled % 6 !== 5){
          const mode = MODES[settled % MODES.length];
          pay(b, b.amount, mode, mode === 'Cash' ? '' : 'UTR' + (100000 + settled * 37));
        }
        settled++;
        return;
      }
      if (b.start > NOW && b.start <= NOW + 25) b.checkedInAt = new Date().toISOString();
      else if ((b.pitch + b.start) % 4 === 0) pay(b, 500, 'UPI', 'UTR' + (500000 + b.start));
    });

    /* A hold about to lapse, and a pitch closed for repair tomorrow. */
    for (let hour = Math.floor(NOW / 60) + 1; hour <= 22; hour++){
      let placed = false;
      [1, 0, 2].forEach(pitch => {
        if (placed || !free(today, pitch, hour * 60, hour * 60 + 60)) return;
        DB.holds.push({ id:uid(), date:today, pitch, start:hour * 60, end:hour * 60 + 60,
          team:'Sunday Regulars', contact:'9388221470', pay:'Payment at venue',
          expiresAt:new Date(Date.now() + 11 * 60000).toISOString(),
          createdBy:USER.name, createdAt:new Date().toISOString() });
        placed = true;
      });
      if (placed) break;
    }
    DB.blocks.push({ id:uid(), date:dateFor(1), pitch:1, start:15 * 60, end:16 * 60,
      reason:'Net repair and line marking', active:1,
      createdBy:USER.name, createdAt:new Date().toISOString() });
  }

  seed();

  /* ── the fake wire ────────────────────────────────────── */
  const ok = body => new Response(JSON.stringify(body),
    { status:200, headers:{ 'Content-Type':'application/json' } });
  const bad = (status, code, message) => new Response(
    JSON.stringify({ error:{ code, message } }),
    { status, headers:{ 'Content-Type':'application/json' } });

  const byId = id => DB.bookings.find(b => b.id === id);
  const touch = b => { b.version++; b.updatedAt = new Date().toISOString(); return b; };

  function tillFor(date){
    const by = { Cash:0, UPI:0, Card:0 };
    DB.bookings.filter(b => b.date === date).forEach(b =>
      Object.keys(by).forEach(m => { by[m] += (b.collectedByMode || {})[m] || 0; }));
    return { by, total:by.Cash + by.UPI + by.Card };
  }

  function stateBetween(from, to){
    const within = d => (!from || d >= from) && (!to || d <= to);
    return {
      bookings:DB.bookings.filter(b => within(b.date)),
      holds:DB.holds.filter(h => within(h.date)
        && new Date(h.expiresAt).getTime() > Date.now()),
      blocks:DB.blocks.filter(b => within(b.date) && b.active),
      settings:DB.settings,
      till:tillFor(dateFor(0)),
      serverTime:new Date().toISOString(),
      timeZone:'Asia/Kolkata',
    };
  }

  const real = window.fetch.bind(window);

  window.fetch = function(input, init){
    const url = String(input && input.url ? input.url : input);
    const path = url.replace(/^https?:\/\/[^/]+/, '');
    if (!path.startsWith('/api/')) return real(input, init);

    const method = ((init && init.method) || 'GET').toUpperCase();
    let body = {};
    try { body = init && init.body ? JSON.parse(init.body) : {}; } catch (_) {}
    const query = new URLSearchParams((path.split('?')[1] || ''));
    const route = path.split('?')[0];

    try { return Promise.resolve(handle(route, method, body, query)); }
    catch (error){ return Promise.resolve(bad(400, 'demo_error', error.message)); }
  };

  function handle(route, method, body, query){
    /* — session — */
    if (route === '/api/auth/me') return ok({ user:USER, csrfToken:'demo' });
    if (route === '/api/auth/login') return ok({ user:USER, csrfToken:'demo' });
    if (route === '/api/auth/logout') return ok({ ok:true });
    if (route === '/api/health') return ok({ ok:true });

    /* — reads — */
    if (route === '/api/state') return ok(stateBetween(query.get('from'), query.get('to')));
    if (route === '/api/accounts'){
      const from = query.get('from'), to = query.get('to');
      const within = d => (!from || d >= from) && (!to || d <= to);
      return ok({ bookings:DB.bookings.filter(b => within(b.date)), payments:DB.payments });
    }
    if (route === '/api/audit') return ok({ events:[] });
    if (route === '/api/settings' && method === 'GET') return ok({ settings:DB.settings });

    /* — settings — */
    if (route === '/api/settings'){
      const amount = Math.round(Number(body.depositAmount));
      if (!(amount >= 0 && amount <= 50000)) return bad(400, 'invalid_deposit', 'Deposit must be between ₹0 and ₹50,000.');
      DB.settings = { depositAmount:amount };
      return ok({ settings:DB.settings });
    }

    /* — bookings — */
    if (route === '/api/bookings' && method === 'POST'){
      const made = createOne(body);
      return made.error ? made.error : ok({ bookings:[made.booking] });
    }
    if (route === '/api/bookings/batch' && method === 'POST'){
      const out = [];
      for (const input of (body.bookings || [])){
        const made = createOne(input);
        if (made.error) return made.error;
        out.push(made.booking);
      }
      return ok({ bookings:out });
    }

    let m;
    if ((m = route.match(/^\/api\/bookings\/([^/]+)\/status$/)) && method === 'POST'){
      const b = byId(m[1]);
      if (!b) return bad(404, 'not_found', 'Booking not found.');
      const next = body.status;
      if (next === 'running'){
        /* One match per pitch, exactly as the server refuses it. */
        const busy = DB.bookings.find(x => x.id !== b.id && x.date === b.date
          && x.pitch === b.pitch && x.status === 'running');
        if (busy) return bad(409, 'pitch_busy',
          PITCHES[b.pitch].name + ' still has ' + busy.team + ' in play. End that session first.');
        b.startedAt = body.atMinute == null ? nowMin() : Math.round(body.atMinute);
        b.endedAt = null;
      }
      if (next === 'done') b.endedAt = Math.round(nowMin());
      if (next === 'upcoming'){ b.startedAt = null; b.endedAt = null; b.pausedAt = null; b.pausedMilliseconds = 0; }
      b.status = next;
      return ok({ booking:touch(b) });
    }
    if ((m = route.match(/^\/api\/bookings\/([^/]+)\/check-in$/)) && method === 'POST'){
      const b = byId(m[1]);
      if (!b) return bad(404, 'not_found', 'Booking not found.');
      b.checkedInAt = body.checked ? new Date().toISOString() : null;
      return ok({ booking:touch(b) });
    }
    if ((m = route.match(/^\/api\/bookings\/([^/]+)\/clock$/)) && method === 'POST'){
      const b = byId(m[1]);
      if (!b) return bad(404, 'not_found', 'Booking not found.');
      if (b.status !== 'running') return bad(409, 'clock_not_running', 'Start the session before changing its clock.');
      if (body.action === 'pause'){ if (!b.pausedAt) b.pausedAt = Date.now(); }
      else if (body.action === 'resume' && b.pausedAt){
        b.pausedMilliseconds = (b.pausedMilliseconds || 0) + Math.max(0, Date.now() - b.pausedAt);
        b.pausedAt = null;
      }
      return ok({ booking:touch(b) });
    }
    if ((m = route.match(/^\/api\/bookings\/([^/]+)\/payments$/)) && method === 'POST'){
      const b = byId(m[1]);
      if (!b) return bad(404, 'not_found', 'Booking not found.');
      const amount = Math.round(Number(body.amount));
      if (!(amount > 0)) return bad(400, 'invalid_amount', 'Payment amount must be greater than zero.');
      if (!['Cash','UPI','Card'].includes(body.mode)) return bad(400, 'invalid_mode', 'Payment mode must be Cash, UPI or Card.');
      pay(b, amount, body.mode, body.reference);
      return ok({ booking:touch(b) });
    }
    if ((m = route.match(/^\/api\/bookings\/([^/]+)\/refunds$/)) && method === 'POST'){
      const b = byId(m[1]);
      if (!b) return bad(404, 'not_found', 'Booking not found.');
      const amount = Math.round(Number(body.amount));
      if (!(amount > 0)) return bad(400, 'invalid_amount', 'Refund must be greater than zero.');
      DB.payments.push({ id:uid(), bookingId:b.id, amount, mode:body.mode || 'Cash',
        kind:'refund', reference:body.reference || '', reason:body.reason || '',
        by:USER.name, createdAt:new Date().toISOString() });
      b.collected = Math.round((b.collected || 0) - amount);
      b.collectedByMode[body.mode || 'Cash'] = Math.round((b.collectedByMode[body.mode || 'Cash'] || 0) - amount);
      return ok({ booking:touch(b) });
    }
    if ((m = route.match(/^\/api\/bookings\/([^/]+)\/extend$/)) && method === 'POST'){
      const b = byId(m[1]);
      if (!b) return bad(404, 'not_found', 'Booking not found.');
      const minutes = Math.round(Number(body.minutes) || 0);
      b.end = Math.min(24 * 60, b.end + minutes);
      b.amount = priceFor(b.pitch, b.start, b.end);
      return ok({ booking:touch(b) });
    }
    if ((m = route.match(/^\/api\/bookings\/([^/]+)\/release$/)) && method === 'POST'){
      const b = byId(m[1]);
      if (!b) return bad(404, 'not_found', 'Booking not found.');
      b.status = 'cancelled';
      return ok({ ok:true });
    }

    /* — holds — */
    if (route === '/api/holds' && method === 'POST'){
      if (!free(body.date, body.pitch, body.start, body.end))
        return bad(409, 'slot_taken', 'This time overlaps another booking.');
      const hold = { id:uid(), date:body.date, pitch:body.pitch, start:body.start, end:body.end,
        team:body.team, contact:body.contact, pay:body.pay || 'Payment at venue',
        expiresAt:new Date(Date.now() + 15 * 60000).toISOString(),
        createdBy:USER.name, createdAt:new Date().toISOString() };
      DB.holds.push(hold);
      return ok({ hold });
    }
    if ((m = route.match(/^\/api\/holds\/([^/]+)\/confirm$/)) && method === 'POST'){
      const i = DB.holds.findIndex(h => h.id === m[1]);
      if (i < 0) return bad(404, 'not_found', 'Hold not found.');
      const h = DB.holds.splice(i, 1)[0];
      const b = makeBooking(h.date, h.pitch, h.start, h.end, h.team, h.contact, 'counter');
      b.pay = h.pay;
      DB.bookings.push(b);
      return ok({ booking:b });
    }
    if ((m = route.match(/^\/api\/holds\/([^/]+)\/release$/)) && method === 'POST'){
      DB.holds = DB.holds.filter(h => h.id !== m[1]);
      return ok({ ok:true });
    }

    /* — blocks — */
    if (route === '/api/blocks' && method === 'POST'){
      if (String(body.reason || '').trim().length < 15)
        return bad(400, 'invalid_reason', 'A maintenance reason of at least 15 characters is required.');
      if (!free(body.date, body.pitch, body.start, body.end))
        return bad(409, 'slot_taken', 'This time overlaps another booking.');
      const block = { id:uid(), date:body.date, pitch:body.pitch, start:body.start, end:body.end,
        reason:body.reason.trim(), active:1, createdBy:USER.name, createdAt:new Date().toISOString() };
      DB.blocks.push(block);
      return ok({ block });
    }
    if ((m = route.match(/^\/api\/blocks\/([^/]+)\/release$/)) && method === 'POST'){
      const block = DB.blocks.find(x => x.id === m[1]);
      if (block) block.active = 0;
      return ok({ ok:true });
    }

    return bad(404, 'not_found', 'The page could not be found');
  }

  function createOne(input){
    const start = Math.round(input.start), end = Math.round(input.end);
    if (!(end > start)) return { error:bad(400, 'invalid_window', 'The end must come after the start.') };
    if (end > 24 * 60) return { error:bad(400, 'closed', 'That runs past closing.') };
    if (!free(input.date, input.pitch, start, end))
      return { error:bad(409, 'slot_taken', 'That slot has already gone.') };
    const team = String(input.team || '').trim();
    const digits = String(input.contact || '').replace(/\D/g, '');
    if (team.length < 2 || digits.length < 8)
      return { error:bad(400, 'invalid_customer', 'Name/team and a contact containing 8 to 15 digits are required.') };
    const b = makeBooking(input.date, input.pitch, start, end, team, input.contact,
      input.source === 'app' ? 'app' : 'counter');
    if (input.pay) b.pay = input.pay;
    DB.bookings.push(b);
    return { booking:b };
  }

  /* A handle for the console, so a fumbled demonstration can be reset without
     a reload losing the page. */
  window.__demo = { DB, reseed(){ DB.bookings = []; DB.holds = []; DB.blocks = []; DB.payments = []; cast = 0; seed(); } };
})();

</script>

<script>
/* ═══════════════════════════════════════════════════════
   TURF OPERATIONS — mobile, built to the Claude Design
   handoff (Turf ERP Mobile.dc.html).

   The holder is ground staff walking between three pitches,
   not the counter. Home is the board itself: today's grid,
   with a red line sweeping down it in real time.

   Rows far from that line stay bubbles. The row it is
   crossing — and the row it is about to reach — opens, and a
   booking on it stops being a bubble and becomes the control
   for that match: check in, start, end, collect. That card
   grammar is the console's, in FRONTEND.md under "A match,
   from arrival to settled".

   Three surfaces push over home and come back with one thumb
   reach: the other days, the custom-slot form and the
   reminder list.

   Same conventions as the console (app.js): one state
   object, full re-render, delegated events, mock data.
   ═══════════════════════════════════════════════════════ */

/* ─── the API ─────────────────────────────────────────── */
/* This app is a second front end over the console's server, not a second copy
   of the turf. There is no mock data left in it: the board is drawn from
   /api/state, every button posts to the same audited endpoints the counter
   posts to, and the session cookie is the console's — which is why the server
   serves this file itself. Open it on another origin and the cookie
   (HttpOnly, SameSite=Strict) never arrives. */

async function apiRequest(path, { method = 'GET', body } = {}){
  const headers = { Accept:'application/json' };
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  if (!['GET','HEAD'].includes(method) && S.csrf) headers['X-CSRF-Token'] = S.csrf;
  const response = await fetch(path, { method, headers, credentials:'same-origin',
    body:body === undefined ? undefined : JSON.stringify(body) });
  const data = await response.json().catch(() => ({}));
  if (!response.ok){
    if (response.status === 401){ S.user = null; S.csrf = ''; }
    const gone = path.startsWith('/api/') && [404, 405, 501].includes(response.status);
    const error = new Error(data.error?.message || (gone
      ? 'The Turf Operations API is not running at this address.'
      : 'Request failed (' + response.status + ').'));
    error.code = data.error?.code;
    throw error;
  }
  return data;
}

/* ─── time ────────────────────────────────────────────── */
const pad2 = n => String(n).padStart(2, '0');
const isoDate = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
/* The board addresses days as an offset from today, so "day 0" is always the
   shift you are standing in and no week arithmetic is needed on a phone. */
const dateAt = offset => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + offset); return d; };
const dateFor = offset => isoDate(dateAt(offset));
const dayLabel = offset => { const d = dateAt(offset); return DOW[(d.getDay() + 6) % 7] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; };
/* An accounts row can be weeks old, so it names its own day rather than
   assuming today. Parsed as local parts — new Date('2026-08-15') is UTC and
   lands a day early east of Greenwich. */
function dayName(iso){
  const p = String(iso).split('-');
  const d = new Date(+p[0], +p[1] - 1, +p[2]);
  return dateFor(0) === iso ? 'Today'
    : dateFor(-1) === iso ? 'Yesterday'
    : DOW[(d.getDay() + 6) % 7] + ' ' + d.getDate() + ' ' + MON[d.getMonth()];
}
/* "Wed 9" — what fits in the gutter the hour labels use. */
function dayTag(iso){
  const p = String(iso).split('-');
  const d = new Date(+p[0], +p[1] - 1, +p[2]);
  return DOW[(d.getDay() + 6) % 7] + ' ' + d.getDate();
}
const todayIso = () => dateFor(0);
const minuteAt = timestamp => {const d=new Date(timestamp);return d.getHours()*60+d.getMinutes()+d.getSeconds()/60+d.getMilliseconds()/60000;};
/* The same local-development clock override the desk client reads, so the two
   surfaces can be driven to the same hour when demonstrating or testing a shift
   that is not happening right now. As there, it is ignored on any host that is
   not localhost, so a fake clock can never ship to a venue.
   Set it with localStorage['turf-erp:clock'] = '19:20', clear with removeItem. */
const clockOverride = () => {
  if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return null;
  let raw = null;
  try { raw = localStorage.getItem('turf-erp:clock'); } catch { return null; }
  if (!raw) return null;
  const [hour, minute] = String(raw).split(':').map(Number);
  if (!Number.isFinite(hour) || hour < 0 || hour > 23) return null;
  return hour * 60 + (Number.isFinite(minute) ? minute : 0);
};
const nowMin = () => {
  const forced = clockOverride();
  return forced != null ? forced : minuteAt(Date.now());
};

/* ─── venue constants ─────────────────────────────────── */
/* Mirrors client/constants.js. OVERVIEW.md flags that pitches and rates exist
   in two tiers already and that the real fix is the server sending them in
   /api/state; this is now a third reader of the same duplication, so when that
   fix lands, delete this block rather than adding to it. */
const PITCHES = [
  { name:'Pitch A',     short:'A',    sub:'7-a-side',  rate:1800 },
  { name:'Pitch B',     short:'B',    sub:'5-a-side',  rate:1200 },
  { name:'Main Ground', short:'Main', sub:'11-a-side', rate:3200 },
];
/* Midnight, mirroring CLOSE_MIN in server/store.mjs and END_HOUR in
   client/constants.js. All three are the same fact in three files. */
const START_HOUR = 6, END_HOUR = 24;
/* A payment status is derived from ledger entries, never a booking-form flag. */
const PAY_FORM = ['Payment at venue'];
const TENDERS = ['Cash','UPI','Card','Split'];
const ROLES = { operator:1, manager:2, owner:3 };

/* ─── state ───────────────────────────────────────────── */
const blankForm = () => ({ team:'', contact:'', pay:'Payment at venue' });

const S = {
  /* session */
  ready:false, user:null, csrf:'', authError:'', apiError:'', busy:false, syncedAt:0,
  /* server records */
  bookings:[], holds:[], blocks:[], payments:[], accounts:[], settings:{ depositAmount:500 },
  /* screens */
  screen:'home', sheet:null, dayIndex:0,
  boardMode:'all', pitch:0,   // the days grid: all pitches on a day, or one across the week
  collapsedBands:{},
  /* Check-in and clock state are read from the shared ledger. */
  checkedIn:{},
  tender:'UPI', splitCash:'', timerAt:null,
  /* Empty compatibility state for older phone preferences. */
  paused:{},
  form:blankForm(), blockReason:'', cancelReason:'', releaseReason:'',
  sellPitch:0, sellStart:'20:00', sellDur:60,
  sellName:'', sellPhone:'', sellPay:'Payment at venue', sellDone:'',
  moneyFilter:'open', moneyOpen:null, todayFilter:'all',
  /* Settings. The theme is a property of this handset — a counter phone and
     the manager's own can differ — so it never goes to the server. The deposit
     is the venue's, so it does. */
  theme:'system', depositDraft:'',
  revAsk:null, revMode:'Cash', revVal:'', revReason:'',
  scrollMem:{}, _rendered:null, homeParked:false,
  login:{ email:'', password:'' },
};

const can = role => !!S.user && ROLES[S.user.role] >= ROLES[role];
const APP_NAME = 'Futly Console';
/* "R. Kumar" and "operator@turf.test" both have to come out as two letters. */
function initials(){
  const raw = String((S.user && (S.user.name || S.user.email)) || '').trim();
  const parts = raw.split(/[ .@_-]+/).filter(Boolean);
  return ((parts[0] || '?')[0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
}
