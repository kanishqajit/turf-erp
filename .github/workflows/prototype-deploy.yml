name: Deploy free prototype

on:
  push:
    branches: [codex/free-cloudflare-supabase-prototype]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: futly-prototype-deployment
  cancel-in-progress: false

jobs:
  deploy:
    # Enable only after deployment secrets are configured.
    if: vars.FUTLY_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: prototype
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ofjgkrobvzwqkuqgxdho
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 937f678ef09b8df1ae5e02026e99d493
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:portable
      - run: npm run build:edge
      - name: Check deployment credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Apply database migrations from Git
        if: vars.FUTLY_DATABASE_MIGRATIONS_ENABLED == 'true'
        run: node scripts/deploy-migrations.mjs
      - name: Deploy backend first
        run: npx supabase functions deploy futly-api futly-venues --project-ref "$SUPABASE_PROJECT_ID" --use-api
      - run: npm run build:pages
      - name: Deploy frontend
        run: npx wrangler pages deploy dist --project-name futly-prototype --branch codex/free-cloudflare-supabase-prototype --commit-hash "$GITHUB_SHA" --commit-dirty=false
      - name: Verify frontend and backend match pushed commit
        run: node scripts/verify-release.mjs
