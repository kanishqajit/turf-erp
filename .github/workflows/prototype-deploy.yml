name: Deploy free prototype

on:
  push:
    branches: [codex/free-cloudflare-supabase-prototype]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: futly-prototype-deployment
  cancel-in-progress: false

jobs:
  deploy:
    # Enable only after deployment secrets are configured.
    if: vars.FUTLY_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: prototype
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ofjgkrobvzwqkuqgxdho
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 937f678ef09b8df1ae5e02026e99d493
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:portable
      - run: npm run build:edge
      - name: Check deployment credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Deploy backend first
        run: npx supabase functions deploy futly-api --project-ref "$SUPABASE_PROJECT_ID"
      - run: npm run build:pages
      - name: Deploy frontend
        run: npx wrangler pages deploy dist --project-name futly-prototype --branch codex/free-cloudflare-supabase-prototype
      - name: Verify public backend connection
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const response = await fetch('https://futly-prototype.pages.dev/api/health');
          assert.equal(response.status, 200, 'Public API must be healthy after deployment');
          const health = await response.json();
          assert.equal(health.ok, true);
          assert.equal(health.persistence, 'supabase');
          console.log('Public frontend is connected to Supabase.');
          JS
